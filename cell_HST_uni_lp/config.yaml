# =============================================================================
# UNI single-cell Xenium linear-probe config
# =============================================================================

# Data root for the single-cell benchmark
processed_root: /home/sb202604/cell-benchmark/processed

# Optional: use the shared cell-level interface (same cells as cell_HST_middle
# / novae / STFlow). When true, features are read from adata.obsm['he']
# (precomputed UNI 1024-d features) instead of encoding patches.
use_processed_cell: false
processed_cell_root: /home/sb202604/cell-benchmark/processed_cell

# Datasets to evaluate (must match DATASETS in predict.py)
datasets:
  - hSkin_Melanoma
  - hColon_Non_diseased
  - mouse_Colon
  - Human_Breast_Cancer

# Gene selection
n_top_hvgs: 50

# UNI model
uni_local_path: /home/sb202604/UNI

# Inference batch size for the image tower
img_batch_size: 48

# Linear probe (HEST-Bench protocol)
pca_components: 256
ridge_solver: lsqr
ridge_alpha: null
ridge_max_iter: 1000

# Preprocessing
min_counts: 10

# Project-local feature cache
cache_root: ./cache

# Seeds
seeds: [42]

# Device and output
device: cuda
output_root: ./runs
