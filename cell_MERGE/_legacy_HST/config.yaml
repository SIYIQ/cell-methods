# HST_MERGE Cross-Validation Training Configuration
# Data pipeline identical to HST-middle; model/training preserves MERGE design.

# ---- Offline preprocessed cache ----
offline_cache_root: /home/sb202604/hest-bench-pretreat

# ---- HVG selection ----
n_top_hvgs: 50

# ---- CNN Stage (MERGE design) ----
cnn_epochs: 15
cnn_lr: 0.00005
cnn_batch_size: 8
cnn_dropout: 0.2
cnn_pretrained_path: null  # Path to TCGA pretrained ResnetMLP weights
cnn_step_size: 2
cnn_gamma: 0.5

# ---- GNN Stage (MERGE design) ----
gnn_epochs: 400
gnn_lr: 0.001
gnn_attn_heads: 8
gnn_drop_edge: 0.2
gnn_alpha: 0.0           # Correlation loss weight (0 = disabled)
gnn_warmup_steps: 10
gnn_early_stop_patience: 50
gnn_hierarchical: true
gnn_spatial_clusters: 5
gnn_feature_clusters: 5

# ---- Data augmentation ----
augmentation:
  enabled: true
  p_flip_h: 0.5
  p_flip_v: 0.5
  p_rot90: 0.5
  brightness: 0.15
  contrast: 0.15
  saturation: 0.1

# ---- Training settings ----
seeds: [42, 43, 44]
device: cuda
output_root: ./runs
