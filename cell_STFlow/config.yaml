# cell_STFlow training configuration.
#
# Cell-level adaptation of HST_STFlow. Consumes the shared cell-level data
# interface at /home/sb202604/cell-benchmark/processed_cell/.

# ---- Datasets ----
datasets:
  - hSkin_Melanoma
  - hColon_Non_diseased
  - mouse_Colon
  - Human_Breast_Cancer

# ---- STFlow Denoiser hyperparameters ----
hidden_dim: 64
pairwise_hidden_dim: 64
n_layers: 2
n_heads: 4
dropout: 0.2
attn_dropout: 0.2
n_neighbors: 3
activation: swiglu

# ---- STFlow flow-matching sampling ----
n_sample_steps: 3
# STFlow supports 'gaussian'/'zero'/'zinb'. The HST_STFlow default is 'zinb'.
# Running 'zinb' requires scvi-tools to be installed in the environment.
prior_sampler: zinb
zinb_logits: 0.1
zinb_total_count: 1.0
zinb_zi_logits: 0.0

# ---- Training ----
epochs: 500
lr: 1.0e-3
weight_decay: 0.0

# Loss is STFlow's native MSE flow-matching loss; this key is kept for
# interface parity with cell_novae / cell_HST_middle.
loss: mse

seeds: [42, 43, 44]

# Logging / output
output_root: ./runs

# Device
device: cuda:0
