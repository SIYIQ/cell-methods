# HST_STFlow per-task config: Task2_ILC
# Mirrors HST_novae/config_Task2_ILC.yaml verbatim for data / training
# hyperparameters; STFlow architecture stays at STFlow defaults.

offline_cache_root: /home/sb202604/hest-bench-pretreat

encoder_name: h0_mini
encoder_unfreeze: true
encoder_unfreeze_last_n_blocks: 2     # v1=4 → 2,减少 backbone 切片特异性过拟合
encoder_local_path: /home/sb202604/H0-mini
encoder_out_dim: 768

n_genes: 50
n_top_hvgs: 50

stflow_hidden_dim: 128
stflow_pairwise_hidden_dim: 128
stflow_n_layers: 4
stflow_n_heads: 4
stflow_dropout: 0.2
stflow_attn_dropout: 0.2
stflow_n_neighbors: 8
stflow_activation: swiglu

stflow_n_sample_steps: 5
stflow_prior_sampler: zinb
stflow_zinb_logits: 0.1
stflow_zinb_total_count: 1.0
stflow_zinb_zi_logits: 0.0

pixel_size_um: 0.46
dist_thresh_um: 150.0

augmentation:
  enabled: true
  p_flip_h: 0.5
  p_flip_v: 0.5
  p_rot90: 0.5
  brightness: 0.25                    # v1=0.15 → 0.25
  contrast: 0.25                      # v1=0.15 → 0.25
  saturation: 0.15                    # v1=0.1  → 0.15
  hue: 0.03

grid_training:
  enabled: true
  n_spots_per_patch: 512
  n_patches_per_slide: -1
  n_shift_steps: 4
  halo_dist_thresh_um: 150.0
  cycle_mode: false

epochs: 300                           # v1=400 → 300
lr: 1.0e-4
encoder_lr: 5.0e-6                    # v1=1e-5 → 5e-6
wd: 3.0e-4                            # v1=1e-4 → 3e-4
img_batch_size: 32
full_graph: false
grad_clip: 1.0

spot_split_ratios: [0.7, 0.1, 0.2]
eval_interval: 1
early_stop_patience: 40

lr_factor: 0.5
lr_patience: 15
lr_threshold: 1.0e-5
lr_min: 1.0e-6
lr_cooldown: 0

seeds: [42, 43, 44]
device: cuda
output_root: ./runs
